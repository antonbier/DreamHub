<!--
  DreamHub's app icon (maskable: full bleed) — the same hub mark as the Enigma2
  plugin's icon (../../enigma2-plugin/art/plugin-icon.svg): one node in the
  middle, five around it, on DESIGN.md's dark `tile`. The launcher cuts its own shape; the mark stays inside the central 80 % safe zone.
  Rendered to the PNGs next to it by ../art/render-icons.mjs.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#161A1F"/>
  <g stroke="#6AA6E8" stroke-width="24" stroke-linecap="round" opacity="0.75">
    <line x1="256" y1="256" x2="256" y2="106"/>
    <line x1="256" y1="256" x2="398.5" y2="209.5"/>
    <line x1="256" y1="256" x2="344.5" y2="377.5"/>
    <line x1="256" y1="256" x2="167.5" y2="377.5"/>
    <line x1="256" y1="256" x2="113.5" y2="209.5"/>
  </g>
  <g fill="#6AA6E8">
    <circle cx="256" cy="106" r="39"/>
    <circle cx="398.5" cy="209.5" r="39"/>
    <circle cx="344.5" cy="377.5" r="39"/>
    <circle cx="167.5" cy="377.5" r="39"/>
    <circle cx="113.5" cy="209.5" r="39"/>
  </g>
  <circle cx="256" cy="256" r="66" fill="#E6E9EC"/>
